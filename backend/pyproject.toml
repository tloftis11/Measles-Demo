[project]
name = "measles-hotspot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "duckdb>=1.1.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "anthropic>=0.40.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# Only needed for data-fetching scripts, not the FastAPI runtime
scripts = [
  "geopandas>=1.0.0",
  "shapely>=2.0.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
